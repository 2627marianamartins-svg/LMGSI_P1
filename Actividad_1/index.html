<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Pel·lícules</title>

    <link rel="icon" href="favicon.ico" type="image/png">

    <link rel="stylesheet" href="css/estils.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <a href="index.html">
        <img src="img/logo.svg" alt="TMDB Logo" height="30">
    </a>

    <nav>
        <ul>
            <li><a href="index.html">Buscador</a></li>
            <li><a href="contacte.html">Contacte</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="buscador">

        <h1>BUSCA UNA PEL·LÍCULA</h1>

        <p>Milions de títols, un sol cercador.</p>

        <form method="get" action="https://www.themoviedb.org/search">

            <input
                class="barra-cerca"
                type="search"
                name="query"
                placeholder="Cerca una pel·lícula, per exemple «Dune»..."
            >

            <button type="submit">Cercar</button>

        </form>

    </section>

    <section class="pelicules">

        <h2>Resultats</h2>

        <div class="resultats">

            <article class="tarjeta">
                <img src="img/Toy.jpg" alt="Toy Story">

                <div class="info">
                    <h3>Toy Story 5</h3>
                    <p>2026</p>
                </div>
            </article>

            <article class="tarjeta">
                <img src="img/Aun.jpg" alt="Aún estoy aquí">

                <div class="info">
                    <h3>Aún estoy aquí</h3>
                    <p>2025</p>
                </div>
            </article>

            <article class="tarjeta">
                <img src="img/Spider.jpg" alt="Spider-Man">

                <div class="info">
                    <h3>Spider‑Man: Brand New Day</h3>
                    <p>2026</p>
                </div>
            </article>

        </div>

    </section>

</main>

<footer>
    <p>© 2026 The Movie Database — Maqueta de disseny</p>
</footer>

</body>
</html>
